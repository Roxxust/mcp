[package]
name = "mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.5.1", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
schemars = "1"

#get_time:
chrono = "0.4"
chrono-tz = "0.6"
